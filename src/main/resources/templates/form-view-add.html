<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>

<h1 class="text-center" style="margin: 15px auto">THÊM MỚI VẬT PHẨM</h1>
<form style="width: 80%; margin: 10px auto" th:action="@{/game-items/handle-add}" th:object="${gameItemDTO}" method="post" enctype="multipart/form-data">
        <input th:field="*{id}" type="hidden">
    <div class="form-group">
        <label for="">Item Name: </label>
        <input type="text" class="form-control" th:field="*{itemName}" placeholder="">
        <small th:if="${#fields.hasErrors('itemName')}" th:errors="*{itemName}" class="form-text text-danger">Help text</small>
    </div>
    <div class="form-group">
        <label for="">Game Title: </label>
        <input type="text" class="form-control" th:field="*{gameTitle}" placeholder="">
        <small th:if="${#fields.hasErrors('gameTitle')}" th:errors="*{gameTitle}" class="form-text text-danger">Help text</small>
    </div>
    <div class="form-group">
        <label for="">Market Price: </label>
        <input type="number" class="form-control" th:field="*{marketPrice}" placeholder="">
        <small th:if="${#fields.hasErrors('marketPrice')}" th:errors="*{marketPrice}" class="form-text text-danger">Help text</small>
    </div>
    <div class="form-group">
        <label for="">Drop Date: </label>
        <input type="date" class="form-control" th:field="*{dropDate}" placeholder="">
        <small th:if="${#fields.hasErrors('dropDate')}" th:errors="*{dropDate}" class="form-text text-danger">Help text</small>
    </div>
    <div class="form-group">
        <label for="">Item Image: </label>
        <input type="file" class="form-control" th:field="*{itemImage}" placeholder="">
        <small th:if="${#fields.hasErrors('itemImage')}" th:errors="*{itemImage}" class="form-text text-danger">Help text</small>
    </div>
    <div class="form-group">
        <label for="">Is Tradeable: </label>
        <select class="form-control" th:field="*{isTradeable}">
            <option value=true>Tradeable</option>
            <option value=false>UnTradeable</option>
        </select>
    </div>
    <div class="form-group">
        <label for="">Ratity</label>
        <select class="form-control" th:field="*{ratityId}">
            <option th:each="r: ${ratityList}" th:value="${r.id}" th:text="${r.name}"></option>
        </select>
    </div>

    <button class="btn btn-primary" type="submit">Thêm</button>
</form>

<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
